<!doctype html>
<!-- RTL + Kurdish (Sorani) is enforced globally at the document level. -->
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Pre-hydration status-bar tint. Matches the dark app background
         (--app-bg-dark, default purple accent); AppContext keeps it in sync
         with the live theme + accent thereafter. -->
    <meta name="theme-color" content="#1b193b" />
    <meta name="description" content="شوێنی تایبەتی دلین بۆ خوێندن — تێبینی، کویز و تەرکیز" />
    <!-- iOS standalone: launch chromeless from the home screen, like a native app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دلین" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Active font: NRT (Bold) for Kurdish + Latin text, self-hosted via @font-face
         in src/index.css; Latin system font for digits. -->

    <title>خوێندنی دلین</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
